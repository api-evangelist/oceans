name: Oceans
description: >-
  Oceans Healthcare is a behavioral health system operating a network of
  psychiatric hospitals and outpatient programs across the southern United
  States. Founded in 2010 and backed by General Catalyst, the company delivers
  inpatient and outpatient mental health treatment for adolescents, adults,
  older adults, and veterans and first responders, spanning acute inpatient
  psychiatry, partial hospitalization, intensive outpatient, and virtual
  telehealth care. Oceans Healthcare is a care-delivery operator focused on
  safety, stability, and lasting healing; it does not publish a public developer
  API, developer portal, or OpenAPI definition at this time.
